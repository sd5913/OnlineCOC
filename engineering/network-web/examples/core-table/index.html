<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>body{font:16px system-ui;background:#f5f4ef;color:#26372f;padding:20px;margin:0}button,input,textarea,select{font:inherit;padding:8px;margin:5px}button{background:#284f42;color:white;border:0;border-radius:4px;cursor:pointer}textarea{display:block;width:94%;min-height:65px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px;border-radius:5px}summary{cursor:pointer}#error{color:#a31c2f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<h1>首测规则桌面</h1><p id="account">正在读取身份…</p><p id="isolation"></p><p id="error" role="alert"></p><div class="grid"><section><h2>规则动作</h2><input id="action" value="demo.damage" aria-label="动作 ID"><textarea id="args" aria-label="动作参数">{"actor":"actor-player1","amount":1}</textarea><button id="invoke">执行动作</button><details><summary>通用命令（按契约）</summary><input id="operation" value="action.invoke" aria-label="命令操作"><textarea id="operation-args" aria-label="命令参数">{}</textarea><button id="send-command">提交命令</button></details><h2>房间聊天</h2><input id="chat-text" aria-label="聊天内容"><button id="chat-send">发送</button><pre id="chat"></pre><button id="reference">加载规则参考</button><button id="note">读取已授权线索</button><pre id="resource"></pre></section><section><button id="refresh">刷新状态</button><h2>当前授权状态</h2><pre id="state"></pre><details><summary>动作目录与协议</summary><pre id="catalog"></pre><pre id="contracts"></pre></details><h2>执行结果</h2><pre id="result"></pre></section></div>
<script>
const $=s=>document.querySelector(s);let port,view;const pending=new Map();
function call(method,params={}){return new Promise((resolve,reject)=>{const id=crypto.randomUUID();pending.set(id,{resolve,reject});port.postMessage({id,method,params});});}
const req=(path,method="GET",body)=>call("request",{path,options:{method,...(body?{body}:{})}});
const show=(s,v)=>$(s).textContent=typeof v==="string"?v:JSON.stringify(v,null,2);
const run=fn=>async()=>{show("#error","");try{await fn();}catch(e){show("#error",e.message||e.code);}};
async function refresh(){view=await req("view");show("#state",view);}
async function command(op,args){await refresh();const body={protocolVersion:1,type:"command",requestId:crypto.randomUUID(),roomId:view.roomId,payload:{commandId:crypto.randomUUID(),runId:view.runId,authorityEpoch:view.authorityEpoch,catalogRevision:view.catalog.revision,rulesetRevision:view.catalog.rulesetRevision,expectedViews:{},op,args}};show("#result",await req("commands","POST",body));await refresh();}
async function resource(group){const data=await call("resource.load",{group});show("#resource",data.files.map(f=>f.path+"\n"+new TextDecoder().decode(f.bytes)).join("\n\n"));}
window.addEventListener("message",event=>{if(event.source!==parent||event.data?.type!=="onlinecoc:port"||port)return;port=event.ports[0];port.onmessage=event=>{const v=event.data;if(v.event==="state"){if(v.message.type==="snapshot.end"||v.message.type==="patch")refresh().catch(()=>{});return;}const p=pending.get(v.id);if(!p)return;pending.delete(v.id);v.ok?p.resolve(v.result):p.reject(Object.assign(new Error(v.error.code),v.error));};run(async()=>{const me=await req("me");show("#account","游戏账号："+me.accountId);await refresh();show("#catalog",await req("catalog"));show("#contracts",await req("contracts"));await call("subscribe");})();});
try{parent.document.body;show("#isolation","隔离失败");}catch{show("#isolation","游戏界面已隔离平台账号");}
$("#invoke").onclick=run(()=>command("action.invoke",{actionId:$("#action").value,input:JSON.parse($("#args").value)}));
$("#send-command").onclick=run(()=>command($("#operation").value,JSON.parse($("#operation-args").value)));
$("#chat-send").onclick=run(async()=>{await command("chat.message.send",{channelId:"general",text:$("#chat-text").value});show("#chat",await req("chat/history","POST",{channelId:"general",limit:20}));$("#chat-text").value="";});
$("#refresh").onclick=run(refresh);$("#reference").onclick=run(()=>resource("reference"));$("#note").onclick=run(()=>resource("revealed-note"));parent.postMessage({type:"onlinecoc:connect"},"*");
</script></body></html>
