[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onlinecoc-p2p"
version = "0.2.3"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.5", "aiortc==1.16.0", "argon2-cffi==25.1.0"]

[project.scripts]
onlinecoc-p2p = "onlinecoc_p2p.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onlinecoc_p2p = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
